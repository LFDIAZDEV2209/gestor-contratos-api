# nexogc - CodeBuild: migraciones TypeORM contra RDS prod via task one-off ECS (Fargate).
# Replica 10-migrate-prod.ps1 pero con la taskdef NUEVA (imagen SHA inmutable) registrada
# por api.build.yml. Si la migracion falla, el pipeline se detiene ANTES de tocar el servicio.
version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: us-east-1
    CLUSTER: nexogc-cluster
    SUBNETS: subnet-0c3fc84dec1c124ff,subnet-091e5771ece835a8f
    SG_APP: sg-0833c597223758f9d

phases:
  build:
    commands:
      - TD_ARN=$(jq -r '.taskDefinitionArn' build-out.json) && echo "Migrando con taskdef $TD_ARN" || exit 1
      - export TD_ARN
      - TASK_ARN=$(aws ecs run-task --region "$AWS_DEFAULT_REGION" --cluster "$CLUSTER" --task-definition "$TD_ARN" --launch-type FARGATE --started-by codepipeline-migrate --network-configuration "awsvpcConfiguration={subnets=[$SUBNETS],securityGroups=[$SG_APP],assignPublicIp=DISABLED}" --overrides '{"containerOverrides":[{"name":"api","command":["node","node_modules/typeorm/cli.js","migration:run","-d","dist/database/data-source.js"]}]}' --query "tasks[0].taskArn" --output text) || exit 1
      - export TASK_ARN
      - echo "Task one-off $TASK_ARN"
      - aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$TASK_ARN"
      - export EXIT=$(aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$TASK_ARN" --query "tasks[0].containers[0].exitCode" --output text)
      - echo "Exit code de la migracion $EXIT"
      - test "$EXIT" = "0"
